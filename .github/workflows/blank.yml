
name: Build MCGG APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android source ZIP
        id: source
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname '*MCGG*Android*Source*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP tidak ditemukan"
            find . -maxdepth 4 -type f
            exit 1
          fi
          echo "ZIP ditemukan: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p android-project
          unzip -o "${{ steps.source.outputs.zip_file }}" -d android-project

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          BUILD_FILE=$(find android-project -maxdepth 5 -type f \( -name gradlew -o -name build.gradle -o -name build.gradle.kts \) | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "Konfigurasi Gradle tidak ditemukan dalam ZIP"
            find android-project -maxdepth 5 -type f
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MCGG-Predictor-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
