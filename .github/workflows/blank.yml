name: Build MCGG Predictor APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack Modern App & Build APK
        run: |
          echo "=== Menyiapkan Kodingan Proyek Tampilan Modern ==="
          rm -f *.html *.zip.html project.zip || true

          # Ekstrak kodingan Android UI modern (persis seperti preview web & fix tombol klik)
          echo "" | base64 -d | tar -xzf -

          echo "=== File Proyek Siap ==="
          ls -la app/src/main/java/id/krizz/mcggpredictor/

          echo "=== Memulai Kompilasi APK ==="
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCGG-Predictor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
