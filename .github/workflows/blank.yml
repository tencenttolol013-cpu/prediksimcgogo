name: Build MCGG Predictor APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Project Files & Build APK
        run: |
          # 1. Ekstrak otomatis file .zip atau .zip.html yang ada di repo kamu
          shopt -s nullglob
          for f in *.zip *.zip.html *.zip.*; do
            if [ -f "$f" ]; then
              echo "Mengekstrak file arsip: $f"
              unzip -o "$f" || true
            fi
          done

          # 2. Masuk ke folder proyek
          PROJECT_DIR=$(find . -maxdepth 3 -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          if [ -n "$PROJECT_DIR" ]; then
            cd "$PROJECT_DIR"
          fi

          echo "Daftar file yang siap dirakit:"
          ls -la

          # 3. Jalankan kompilasi APK
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCGG-Predictor-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
