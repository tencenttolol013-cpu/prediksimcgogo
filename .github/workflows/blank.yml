name: Build MCGG Predictor APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: |
          # Otomatis deteksi jika file berada di dalam subfolder MCGG_Predictor_Android
          if [ -d "MCGG_Predictor_Android" ] && [ -f "MCGG_Predictor_Android/settings.gradle.kts" ]; then
            echo "Project ditemukan di subfolder MCGG_Predictor_Android"
            cd MCGG_Predictor_Android
          fi

          echo "Direktori saat ini: $(pwd)"
          ls -la

          # Jalankan build dengan gradlew atau gradle
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCGG-Predictor-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
