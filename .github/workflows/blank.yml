
      - name: Find Android Project
        run: |
          echo "Mencari folder proyek Android..."
          find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")"
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "File app/build.gradle tidak ditemukan di $PROJECT_DIR"
            echo "Periksa struktur folder repository."
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace
          echo "APK dibuat di: $PROJECT_DIR/app/build/outputs/apk/debug/"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Raja-Gokgok-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
