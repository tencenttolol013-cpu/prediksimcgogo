
name: Build MCGG APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android source ZIP
        id: source
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname '*MCGG*Android*Source*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP project Android tidak ditemukan."
            echo "Daftar file repository:"
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -o "${{ steps.source.outputs.zip_file }}" -d android-project
          echo "Daftar file project:"
          find android-project -maxdepth 4 -type f | head -200

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          ROOT="android-project"

          while [ ! -f "$ROOT/gradlew" ] && [ ! -f "$ROOT/build.gradle" ] && [ ! -f "$ROOT/build.gradle.kts" ]; do
            NEXT=$(find "$ROOT" -mindepth 2 -maxdepth 4 -type f \( -name gradlew -o -name build.gradle -o -name build.gradle.kts \) | head -n 1)

            if [ -z "$NEXT" ]; then
              echo "File build.gradle, build.gradle.kts, atau gradlew tidak ditemukan."
              echo "ZIP mungkin bukan project Android lengkap."
              exit 1
            fi

            ROOT=$(dirname "$NEXT")
            break
          done

          echo "Project directory: $ROOT"
          echo "dir=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

            - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MCGG-Predictor-APK
          path: |
            android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
