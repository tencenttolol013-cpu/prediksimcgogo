
name: Build MCGG APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MCGG_Predictor_Android_Source.zip'
      - '.github/workflows/blank.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o MCGG_Predictor_Android_Source.zip -d android-project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MCGG-Predictor-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
